services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: lti_ats
      POSTGRES_USER: lti
      POSTGRES_PASSWORD: lti_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U lti -d lti_ats']
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    ports:
      - '8080:8080'
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build: ./frontend
    ports:
      - '3000:80'
    depends_on:
      - backend

volumes:
  postgres_data:
